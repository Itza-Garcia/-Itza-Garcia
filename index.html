<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Delay</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #ffffff;
            color: #222;
            margin: 0;
            padding: 16px;
        }
        h1 { font-size: 1.4rem; margin: 0 0 12px; }
        #status { margin: 12px 0; color: #555; }
        button {
            font-size: 1rem;
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #f2f2f2;
            cursor: pointer;
        }
        button:hover { background: #e4e4e4; }
        #start { font-size: 1.2rem; padding: 12px 28px; }
        #controls { display: none; max-width: 420px; }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 10px 0;
        }
        .row label { flex: 1; }
        .row input { width: 110px; font-size: 1rem; padding: 4px; }
    </style>
</head>
<body>
    <h1>Basic Delay</h1>

    <div id="status">Loading ...</div>
    <button id="start" style="display:none">Start</button>

    <div id="controls">
        <!-- Rename the labels below to match what each control does in your patch -->
        <div class="row">
            <label>Play sample (bang)</label>
            <button id="bang">Play</button>
        </div>
        <div class="row">
            <label>Message box</label>
            <button id="msg">Send</button>
        </div>
        <div class="row">
            <label for="n7">Number 1</label>
            <input type="number" id="n7" data-node="n_0_7" step="any">
        </div>
        <div class="row">
            <label for="n8">Number 2</label>
            <input type="number" id="n8" data-node="n_0_8" step="any">
        </div>
        <div class="row">
            <label for="n9">Number 3</label>
            <input type="number" id="n9" data-node="n_0_9" step="any">
        </div>
        <div class="row">
            <label for="n12">Number 4</label>
            <input type="number" id="n12" data-node="n_0_12" step="any">
        </div>
    </div>

    <script src="webpd-runtime.js"></script>
    <script>
        const statusDiv = document.querySelector('#status')
        const startButton = document.querySelector('#start')
        const controlsDiv = document.querySelector('#controls')
        const audioContext = new AudioContext()

        let patch = null
        let stream = null
        let webpdNode = null

        const initApp = async () => {
            await WebPdRuntime.initialize(audioContext)
            const response = await fetch('patch.wasm')
            patch = await response.arrayBuffer()
            statusDiv.textContent = 'Click Start to begin.'
            startButton.style.display = 'inline-block'
        }

        const startApp = async () => {
            if (audioContext.state === 'suspended') {
                await audioContext.resume()
            }

            webpdNode = await WebPdRuntime.run(
                audioContext,
                patch,
                WebPdRuntime.defaultSettingsForRun('./patch.wasm', receiveMsgFromWebPd),
            )
            webpdNode.connect(audioContext.destination)

            // Microphone is optional: if it's blocked, the patch still runs
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true })
                audioContext.createMediaStreamSource(stream).connect(webpdNode)
            } catch (e) {
                console.log('No microphone input (that is fine if the patch does not use adc~)')
            }

            startButton.style.display = 'none'
            statusDiv.style.display = 'none'
            controlsDiv.style.display = 'block'
        }

        startButton.onclick = startApp

        initApp().catch((err) => {
            statusDiv.textContent = 'Could not load the patch: ' + err
            console.error(err)
        })

        const sendMsgToWebPd = (nodeId, portletId, message) => {
            if (!webpdNode) return
            webpdNode.port.postMessage({
                type: 'io:messageReceiver',
                payload: { nodeId, portletId, message },
            })
        }

        // Bang and message box
        document.querySelector('#bang').onclick = () => sendMsgToWebPd('n_0_2', '0', ['bang'])
        document.querySelector('#msg').onclick = () => sendMsgToWebPd('n_0_3', '0', ['bang'])

        // Number boxes: send the value whenever it changes
        document.querySelectorAll('input[data-node]').forEach((input) => {
            input.addEventListener('change', () => {
                const value = parseFloat(input.value)
                if (!isNaN(value)) sendMsgToWebPd(input.dataset.node, '0', [value])
            })
        })

        // Messages coming back from the patch update the matching number box
        const receiveMsgFromWebPd = (nodeId, portletId, message) => {
            const input = document.querySelector(`input[data-node="${nodeId}"]`)
            if (input && typeof message[0] === 'number') input.value = message[0]
        }
    </script>
</body>
</html>
